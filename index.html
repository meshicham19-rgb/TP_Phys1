<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="author" content="Hicham MESBAH"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style></head><body>
<title>Physique · Pr Hicham MESBAH</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
@font-face{font-family:"Orbitron";src:url("libs/Orbitron.ttf") format("truetype");font-weight:400 900;font-display:swap}
/* Layout : console d'instrument — sommaire des manips | scène 3D | paillasse (manipulation / relations / compte rendu) */
:root{
  --bg:#0f1318; --panel:#151a21; --panel2:#1b222b; --line:#28323e; --fg:#e7ecf1; --muted:#8e9bab; --ink:#0f1318;
  --sv:#4cc293; --smp:#74a9ff; --c:var(--sv); --warn:#f0a43c; --bad:#ff6f6f; --ok:#4cc293;
  --paper:#f3f5f7; --pink:#1c2229; --rule:#c3cad3; --okp:#1d8456; --badp:#c23b3b; --ansp:#2563c9;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body[data-fil="smp"]{--c:var(--smp)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.top{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.sign{display:grid;justify-items:start;line-height:1;padding-left:18px;border-left:1px solid var(--line);min-width:0}
.sign span{font-family:var(--f-display);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sign em{font-family:"Orbitron","Eurostile","Bank Gothic",var(--f-display);font-style:normal;font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--fg);margin:4px 0 0;white-space:nowrap;line-height:1.1}
.sign svg{width:100%;max-width:230px;height:8px}
.sign em b{font-family:"Orbitron",var(--f-display);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--c);vertical-align:.3em;margin-right:6px}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.fil button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.15;min-width:0}
.fil button b{font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.fil button span{font-size:11.5px;color:var(--muted)}
.fil button[data-f="sv"]{--k:var(--sv)} .fil button[data-f="smp"]{--k:var(--smp)}
.fil button[aria-selected="true"]{border-color:var(--k);box-shadow:inset 0 -3px 0 var(--k);background:#1f2833}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.corr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.work{display:grid;grid-template-columns:232px minmax(0,1fr) 430px;min-height:0}
.work.wide{grid-template-columns:232px minmax(0,.85fr) minmax(0,1.15fr)}
.manips{display:flex;flex-direction:column;gap:6px;padding:16px 12px 16px 16px;border-right:1px solid var(--line);overflow:auto;min-height:0}
.wtitle{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:2px 4px 6px}
.manips button{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.manips button:hover{background:var(--panel2)}
.manips button[aria-current="true"]{background:var(--panel2);border-color:var(--line)}
.manips button i{font-style:normal;grid-row:span 2;font-family:var(--f-mono);font-size:11px;color:var(--c);border:1px solid var(--c);border-radius:4px;padding:1px 5px;margin-top:2px}
.manips button b{font-weight:600;font-size:13.5px}
.manips button span{font-size:12px;color:var(--muted)}
.modnote{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 4px 0;border-top:1px solid var(--line)}
.stage{position:relative;min-width:0;min-height:0;background:#0d1116}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.hud .tag{background:rgba(15,19,24,.8);border:1px solid var(--line);border-radius:8px;padding:6px 10px;backdrop-filter:blur(4px)}
.hud .tag b{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;display:block;line-height:1.1}
.hud .tag span{font-size:12px;color:var(--muted)}
.hud .acts{display:flex;gap:6px;pointer-events:auto;align-items:flex-start;flex-wrap:wrap}
.hint{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:flex-start;pointer-events:none}
.hint span{font-size:12.5px;color:#cfd7e0;background:rgba(15,19,24,.82);border:1px solid var(--line);padding:5px 10px;border-radius:6px;max-width:100%}
.hint span.on{color:var(--fg);border-color:var(--c)}
.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:#3a4756}
.btn.pri{background:var(--c);border-color:var(--c);color:var(--ink);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pw[aria-pressed="true"]{background:#1b3a2c;border-color:var(--ok);color:var(--ok)}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0;min-width:0;padding:0 16px 48px}
.ptabs{position:sticky;top:0;z-index:3;background:var(--panel);display:flex;gap:4px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ptabs button{flex:1;font:inherit;font-family:var(--f-display);font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 4px;cursor:pointer;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--fg);background:var(--panel2);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--c)}
.pane{display:flex;flex-direction:column;gap:14px}
.blk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.goal{font-size:13px;color:#c9d2dc;margin:0}
.goal ol{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center}
.row>label,.row>.lab{font-size:12.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#11161c;border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{flex:1 1 auto;font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--ink);font-weight:600}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{font:inherit;font-size:12.5px;color:var(--muted);background:#11161c;border:1px dashed #3a4654;border-radius:7px;padding:6px 10px;cursor:pointer}
.tog button[aria-pressed="true"]{color:var(--fg);border-style:solid;border-color:var(--c);background:#1d2731}
.tog button[aria-pressed="true"]::before{content:"✓ ";color:var(--c)}
select,input[type=number]{font:inherit;font-size:13px;color:var(--fg);background:#11161c;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--c)}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.cols button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.wl{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
.wl div{display:flex;align-items:center;gap:8px;font-size:12.5px;background:#11161c;border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 8px}
.wl div i{width:12px;height:12px;border-radius:50%;flex:none}
.wl div span{flex:1;min-width:0}
.wl div button{font:inherit;color:var(--muted);background:none;border:0;cursor:pointer;font-size:15px;line-height:1;padding:2px 6px}
.wl div button:hover{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:#11161c;color:var(--muted);letter-spacing:0;text-transform:none;font-family:var(--f-body)}
.pill.ok{color:var(--ok);border-color:#24503f}.pill.bad{color:var(--bad);border-color:#5c2c2c}.pill.warn{color:var(--warn);border-color:#5a4423}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:#11161c;border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
.kv small{display:block;color:var(--muted);font-size:11.5px}
.kv strong{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{font-size:12.5px;border-radius:7px;padding:7px 10px;border:1px solid var(--line);background:#11161c;color:#c9d2dc}
.msg.warn{border-color:#5a4423;color:var(--warn)} .msg.bad{border-color:#5c2c2c;color:var(--bad)} .msg.ok{border-color:#24503f;color:var(--ok)}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dials canvas,.zoom{width:100%;height:auto;border-radius:7px;border:1px solid var(--line);display:block;background:#efe9d9}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:#121820;text-align:right;font-size:11.5px}
td:first-child,th:first-child{text-align:left}
td{font-family:var(--f-mono)}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);font-size:12.5px;padding:10px;text-align:center}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.plot{width:100%;height:auto;display:block;background:#11161c;border:1px solid var(--line);border-radius:8px;color:var(--fg)}
.plot .ax{stroke:#5b6876;stroke-width:1}
.plot .gr{stroke:#222b35;stroke-width:1}
.plot text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.plot .pt{fill:var(--c)}
.plot .rc{fill:none;stroke:var(--c);stroke-opacity:.6;stroke-width:1}
.plot .fit{stroke:var(--fg);stroke-width:1.4}
.plot .ex{stroke:var(--warn);stroke-width:1;stroke-dasharray:5 4}
.big{font-family:var(--f-mono);font-size:13px;line-height:1.7;background:#11161c;border:1px solid var(--line);border-radius:7px;padding:8px 10px;overflow-x:auto}
.big b{color:var(--c);font-weight:600}
.lcd{font-family:var(--f-mono);font-weight:600;font-size:34px;letter-spacing:.06em;color:#ff4b3a;background:#1b0807;border:1px solid #3a1512;border-radius:7px;padding:6px 14px;text-align:right;text-shadow:0 0 12px rgba(255,75,58,.55)}
.gauge{height:8px;border-radius:5px;background:#11161c;border:1px solid var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok));width:0%}
.bands{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bands svg{width:150px;height:40px;flex:none}
/* Relations */
.rel{display:flex;flex-direction:column;gap:8px}
.fx{font-family:var(--f-mono);font-size:13.5px;background:#11161c;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:8px 12px;overflow-x:auto;line-height:2}
.fx small{font-family:var(--f-body);color:var(--muted);font-size:12px;display:block;line-height:1.4}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .2em}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.cc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11.5px}
.cc span{display:flex;align-items:center;gap:5px}
.cc i{width:14px;height:14px;border-radius:3px;border:1px solid #445;flex:none}
/* Compte rendu : feuille */
.crbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.score{font-size:12.5px;color:var(--muted)}
.sheet{background:var(--paper);color:var(--pink);border-radius:8px;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.sheet .crhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;line-height:1.35;border-bottom:1.5px solid var(--pink);padding-bottom:8px}
.sheet h2{font-family:var(--f-display);font-size:21px;letter-spacing:.03em;text-transform:uppercase;text-align:center;margin:4px 0 0;text-wrap:balance}
.sheet h3{font-family:var(--f-display);font-size:16.5px;letter-spacing:.05em;text-transform:uppercase;margin:10px 0 0;color:#0f2a4a;border-bottom:1px solid var(--rule);padding-bottom:3px}
.sheet h4{font-size:13.5px;margin:6px 0 0;color:#0f2a4a}
.sheet p{margin:0;color:#39434f}
.sheet .q{font-weight:600;color:var(--pink)}
.sheet label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#39434f;min-width:0}
.sheet .who{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cri,.sheet textarea{font-family:var(--f-mono);font-size:12.5px;color:var(--pink);background:#fff;border:1px solid var(--rule);border-radius:4px;padding:4px 6px;width:100%;min-width:0;box-sizing:border-box}
.sheet textarea{font-family:var(--f-body);min-height:52px;resize:vertical}
.cri.ok{border-color:var(--okp);background:#e8f6ee}.cri.bad{border-color:var(--badp);background:#fbeceb}
.ans{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ansp);margin-top:2px;white-space:normal}
.sheet .tw{border-color:var(--rule);background:#fff}
.sheet table{font-size:11.5px}
.sheet th{background:#e7ebf0;color:#2b3440;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);text-align:center}
.sheet td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);color:var(--pink);text-align:center}
.sheet td .cri{min-width:74px;text-align:center}
.sheet .plot{background:#fff;border-color:var(--rule);color:var(--pink)}
.sheet .plot .gr{stroke:#e2e6eb}.sheet .plot .ax{stroke:#8792a0}.sheet .plot text{fill:#4a5562}.sheet .plot .pt{fill:#174ea6}.sheet .plot .rc{stroke:#174ea6}.sheet .plot .fit{stroke:#111}
body.nocorr .calc{display:none!important}
@media (max-width:1180px){.work{grid-template-columns:200px minmax(0,1fr) 380px}.work.wide{grid-template-columns:200px minmax(0,.7fr) minmax(0,1.3fr)}}
@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .work,.work.wide{grid-template-columns:minmax(0,1fr)}
  .manips{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .manips button{flex:none;max-width:250px}
  .wtitle,.modnote,.widebtn{display:none}
  .stage{height:58vh;min-height:330px}
  .panel{border-left:0;overflow:visible;padding-bottom:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ptabs{top:env(safe-area-inset-top,0px)}
  .fil{margin-left:0;width:100%}
  .fil button{flex:1 1 0}
}
@media (max-width:620px){.sign{border-left:0;padding-left:0}.brand b{font-size:19px}}
@media (max-width:460px){.row{grid-template-columns:1fr}.dials{grid-template-columns:1fr}.sheet .who{grid-template-columns:1fr}.cc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M5 22 A13 13 0 0 1 29 22" fill="none" stroke="var(--c)" stroke-width="2"/><line x1="17" y1="27" x2="24" y2="11" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="27" r="2.6" fill="var(--c)"/></svg>
      <div><b id="modTitle">Physique I</b><small>Faculté des Sciences d'Agadir · Université Ibn Zohr</small></div>
    </div>
    <div class="sign" aria-label="Conçu par Pr Hicham MESBAH"><span>conçu par</span><em><b>Pr</b>Hicham MESBAH</em><svg viewBox="0 0 180 12" aria-hidden="true"><path d="M4 8 C40 2, 80 12, 120 6 S170 3, 176 7" fill="none" stroke="var(--c)" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="fil" role="tablist" aria-label="Filière">
      <button role="tab" data-f="sv" aria-selected="true"><b>SV2 · STU2</b><span>Sciences de la vie et de la Terre</span></button>
      <button role="tab" data-f="smp" aria-selected="false"><b>SMP2 · SMC2 · SMIA2</b><span>Sciences de la matière</span></button>
    </div>

  </header>
  <main class="work" id="work">
    <nav class="manips" id="nav" aria-label="Manipulations"></nav>

      <canvas id="c3d" tabindex="0" aria-label="Scène 3D de la manipulation"></canvas>
      <div class="hud"><div class="tag" id="hudTag"><b>—</b><span></span></div><div class="acts" id="hudActs"></div></div>

        <button role="tab" data-tab="cr" aria-selected="false">Compte rendu</button>
      </div>
      <div class="pane" id="pm"></div>
      <div class="pane" id="pr" hidden></div>
      <div class="pane" id="pcr" hidden></div>
    </aside>
  </main>
</div>

  const eb=e.target.closest('[data-el]'); if(eb){ st.el[eb.dataset.el]=!st.el[eb.dataset.el]; refresh(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='copy') return copyTable(b);
  if(a==='clear'){ if(m===REFR) st.rows[REFR.key(st)||'liq']=[]; else st.rows=[]; refresh(); return; }
  if(a==='rec'){ m.record(st); refresh(); return; }
  if(a==='serie'){ [0,10,20,30,40,50,60,70,80,85].forEach(x=>m.record(st,x)); refresh(); return; }
  if(a==='ang'){ setKey('i1',+b.dataset.a); return; }
  if(a==='inc'||a==='dec'){ setKey('i1',clamp(st.i1+(a==='inc'?.5:-.5),0,89)); return; }
  if(a==='rot'){ st.rot=st.rot?0:180; refresh(); return; }
  if(a==='nudge'){ const k=b.dataset.k; setKey(k,Math.round((st[k]+ +b.dataset.d)*10)/10); return; }
  if(a==='pset'){ st.xL=XO-(+b.dataset.p); st.pmin=st.pmax=null; refresh(); return; }
  if(a==='pmin'||a==='pmax'){ st[a]=Math.round((st.xE-st.xL)*10)/10; refresh(); return; }
  if(a==='amin'||a==='amax'){ st.am[st.mode+(a==='amin'?'min':'max')]=Math.round((st.xL-XO)*10)/10; refresh(); return; }
  if(a==='areset'){ delete st.am[st.mode+'min']; delete st.am[st.mode+'max']; refresh(); return; }
  if(a==='power'){ st.on=!st.on; refresh(); return; }
  if(a==='unwire'){ st.wires=[]; if(m.W){ m.W.sel=null; m.W.updMark(); } refresh(); return; }
  if(a==='autowire'){ m.autowire(st); refresh(); return; }
  if(a==='delw'){ st.wires.splice(+b.dataset.i,1); refresh(); return; }
});
pcr.addEventListener('input',e=>{ const t=e.target; if(!t.dataset.id) return; CRD[t.dataset.id]=t.value; t.classList.remove('ok','bad'); $$('[data-echo]',pcr).forEach(x=>{ if(x.dataset.echo===t.dataset.id) x.textContent=t.value||'—'; }); save(); });
pcr.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='check') crCheck();
  if(a==='wide'){ $('#work').classList.toggle('wide'); b.textContent=$('#work').classList.contains('wide')?'Réduire':'Agrandir'; }
  if(a==='fill'){ $$('#sheet .cri,#sheet .crt').forEach(el=>{ const id=el.dataset.id, an=CRANS[id]; if(an) el.value=crFmt(an.ans); else if(el.dataset.expr) el.value=el.dataset.expr; else return; CRD[id]=el.value; }); $$('#sheet [data-echo]').forEach(x=>x.textContent=crVal(x.dataset.echo)||'—'); save(); crCheck(); }
  if(a==='crclear'){ const pre=crKey()+'.'; Object.keys(CRD).forEach(k=>{ if(k.startsWith(pre)) delete CRD[k]; }); save(); renderCR(); }
  if(a==='crcopy'){ const d=document.createElement('div'); d.innerHTML=crStaticHTML().replace(/^[\s\S]*<body>|<\/body>[\s\S]*$/g,''); d.querySelectorAll('.ans,.calc,svg').forEach(x=>x.remove()); d.querySelectorAll('tr').forEach(tr=>{ const cs=tr.querySelectorAll('td,th'); cs.forEach((c,i)=>{ if(i<cs.length-1) c.append('\t'); }); }); d.style.position='fixed'; d.style.left='-9999px'; document.body.appendChild(d); const txt=d.innerText; d.remove(); copyText(b,txt,'Texte copié'); }
  if(a==='dl'&&DL){ const spec=crSpec(crKey()); const who=(crVal('noms')||crVal('etu1')||'etudiant').split(/\n/)[0].trim().replace(/[^\wÀ-ÿ -]/g,'').replace(/\s+/g,'_').slice(0,40)||'etudiant'; const name=`CR_${spec.title.split(/[:—]/).pop().trim().replace(/\s+/g,'_').slice(0,40)}_${who}.html`; const o=b.textContent; DL.save({filename:name,data:crStaticHTML()}).then(()=>{ b.textContent='Téléchargé'; setTimeout(()=>b.textContent=o,1800); },err=>{ if(err&&(err.code==='unavailable'||err.code==='not_granted')){ DL=null; b.hidden=true; } else if(err&&err.code!=='declined'){ b.textContent='Échec du téléchargement'; setTimeout(()=>b.textContent=o,1800); } }); }
});

/* ---------- Interaction 3D : bornes, fils, glisser ---------- */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let down=null, drag=null, hoverObj=null, needRefresh=false;
function setRay(e){ const r=cv.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ptr,camera); }
ray.params.Line.threshold=.01;
const shown=o=>{ for(let x=o;x&&x!==world;x=x.parent) if(!x.visible) return false; return true; };
function pickAt(e){ setRay(e); const hits=ray.intersectObject(world,true); for(const h of hits){ if(h.object.isLine||!shown(h.object)) continue; let o=h.object; while(o&&o!==world&&!o.userData.pick) o=o.parent; if(o&&o!==world) return {o,info:o.userData.pick,point:h.point}; } return null; }
function setHover(h){
  const o=h?h.o:null; if(o===hoverObj) return;
  if(hoverObj){ if(hoverObj.userData.pick.type==='term') hoverObj.scale.setScalar(1); if(hoverObj.userData.mat) hoverObj.userData.mat.emissive.set(0x000000); }
  hoverObj=o; cv.style.cursor=o?(['drag','laser'].includes(o.userData.pick.type)?'grab':'pointer'):'';
  if(!o){ setHint(); return; }
  const p=o.userData.pick;
  if(p.type==='term'){ o.scale.setScalar(1.35); setHint(TLAB[p.tid]); }
  else if(p.type==='wire'){ if(o.userData.mat) o.userData.mat.emissive.set(0x553333); setHint('Cliquez pour retirer ce fil'); }
  else if(p.type==='knob') setHint('Bouton des calibres : cliquez pour passer au calibre suivant');
  else if(p.type==='power') setHint('Interrupteur MARCHE / ARRÊT du générateur');
  else if(p.type==='zero') setHint('Réglage du zéro : un clic tourne le bouton (réglage fin dans le panneau)');
  else if(p.type==='laser') setHint('Saisissez le laser et glissez pour changer l\'angle d\'incidence');
  else if(p.type==='dio') setHint('Cliquez pour tourner le dioptre de 180°');
  else if(p.type==='drag') setHint(p.k==='xL'?'Glissez la lentille le long du banc':'Glissez l\'écran le long du banc');
}
cv.addEventListener('pointerdown',e=>{
  down={x:e.clientX,y:e.clientY,btn:e.button};
  if(e.button!==0) return;
  const h=pickAt(e);
  if(h&&cur.m.dragPlane&&['drag','laser'].includes(h.info.type)){ controls.enabled=false; drag={info:h.info,plane:cur.m.dragPlane(h.info)}; cv.style.cursor='grabbing'; try{ cv.setPointerCapture(e.pointerId); }catch(_){} }
},{capture:true});
cv.addEventListener('pointermove',e=>{
  if(drag){ setRay(e); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(drag.plane,p)){ cur.m.onDrag(drag.info,p,cur.st); needRefresh=true; } return; }
  if(e.pointerType==='mouse'&&!(e.buttons&1)) setHover(pickAt(e));
  const W=cur&&cur.m.W; if(W&&W.sel&&W.m.T[W.sel]){ setRay(e); world.updateMatrixWorld(true); const a=tpos(W.m.T[W.sel]); const n=camera.getWorldDirection(new THREE.Vector3()); const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(n,a); const b=new THREE.Vector3(); if(ray.ray.intersectPlane(pl,b)){ W.rub.geometry.setFromPoints([a,b]); W.rub.visible=true; } }
});
cv.addEventListener('pointerleave',()=>{ if(!drag) setHover(null); });
window.addEventListener('pointerup',e=>{
  if(drag){ drag=null; controls.enabled=true; cv.style.cursor=''; needRefresh=false; refresh(); down=null; return; }
  if(down&&e.target===cv&&down.btn===0&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){
    const h=pickAt(e), m=cur.m, st=cur.st;
    if(h){ const p=h.info; if(p.type==='term'&&m.W) m.W.clickTerm(p.tid,st); else if(p.type==='wire'){ st.wires.splice(p.i,1); setHover(null); refresh(); } else if(m.onPick) m.onPick(p,st); }
    else if(m.W&&m.W.sel){ m.W.sel=null; m.W.updMark(); }
  }
  down=null;
});
window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&cur&&cur.m.W&&cur.m.W.sel){ cur.m.W.sel=null; cur.m.W.updMark(); } });

function resize(){ const r=stage.getBoundingClientRect(); const w=Math.max(1,r.width),h=Math.max(1,r.height); renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
let last=performance.now(), tAcc=0;
function loop(t){ const dt=Math.min(.05,(t-last)/1000); last=t; tAcc+=dt; stepTween(dt); controls.update(); if(needRefresh){ needRefresh=false; refresh(); } if(cur&&cur.m.tick) cur.m.tick(dt); const W=cur&&cur.m.W; if(W&&W.mark.visible){ W.mark.lookAt(camera.position); W.mark.scale.setScalar(1+.15*Math.sin(tAcc*6)); } renderer.render(scene,camera); requestAnimationFrame(loop); }
function start(){
  load(); applyCorr();
  const h=(location.hash||'').slice(1).split('-');
  if(FIL[h[0]]){ S.fil=h[0]; S.manip=(h[1]&&FIL[h[0]].manips.find(m=>m.id===h[1]))?h[1]:FIL[h[0]].manips[0].id; }
  resize(); activate(); requestAnimationFrame(loop);
  if(window.AndroidApp&&window.AndroidApp.saveFile){ DL={save:({filename,data})=>new Promise((res,rej)=>{ try{ window.AndroidApp.saveFile(filename,String(data))?res({status:'saved'}):rej({code:'declined'}); }catch(e){ rej({code:'unavailable'}); } })}; const b0=$('#crdl'); if(b0) b0.hidden=false; }
  else try{ if(window.claude&&window.claude.use) window.claude.use('downloads').then(d=>{ DL=d||null; const b=$('#crdl'); if(b) b.hidden=!DL; },()=>{}); }catch(e){}
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1).split('-'); if(FIL[h[0]]&&(h[0]!==S.fil||h[1]!==S.manip)){ S.fil=h[0]; S.manip=(h[1]&&FIL[h[0]].manips.find(m=>m.id===h[1]))?h[1]:FIL[h[0]].manips[0].id; activate(); } });
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(start);
})();
</script>
